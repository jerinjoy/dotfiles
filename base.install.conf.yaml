- defaults:
    link:
      relink: true
      force: true

- clean:
    ~/:
      force: true

- link:
    ~/.config/fish: homedir_files/config/fish
    ~/.config/ghostty: homedir_files/config/ghostty
    ~/.config/git: homedir_files/config/git
    ~/.config/nvim: homedir_files/config/nvim
    ~/.config/rclone: homedir_files/config/rclone
    ~/.config/zed: homedir_files/config/zed
    ~/.config/zellij: homedir_files/config/zellij
    ~/.claude/settings.json: homedir_files/config/claude/settings.json
    ~/.claude/statusline.sh: homedir_files/config/claude/statusline.sh
    ~/.gitconfig: homedir_files/gitconfig
    ~/.gitignore_global: homedir_files/gitignore_global
    ~/.tmux: homedir_files/tmux
    ~/.tmux.conf: homedir_files/tmux.conf
    ~/.vimrc: homedir_files/vimrc

- shell:
    - command: |
        /bin/sh -c '
        if [ ! -f "$HOME/user.gitconfig" ]; then
          printf "Enter your git name: " >&2
          read name
          printf "Enter your git email: " >&2
          read email
          printf "[user]\n    name = %s\n    email = %s\n" "$name" "$email" > "$HOME/user.gitconfig"
          echo "Created ~/user.gitconfig"
        fi'
      description: Setting up ~/user.gitconfig (skipped if exists)
      stdout: true
      stdin: true
      stderr: true
    - [git submodule update --init --recursive, Installing submodules]

- shell:
    - command: fish -c "curl -sL https://raw.githubusercontent.com/jorgebucaran/fisher/main/functions/fisher.fish | source && fisher update"
      description: Installing fisher and the fish plugins listed in ~/.config/fish/fish_plugins.
      stdout: true
      stderr: true
