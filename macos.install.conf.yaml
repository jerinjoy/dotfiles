- shell:
    - command: command -v brew > /dev/null || /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
      description: Installing Homebrew (skipped if already installed)
      stdout: true
      stderr: true

- shell:
    - command: brew bundle --file Brewfile
      description: Installing Homebrew packages
      stdout: true
      stderr: true

- shell:
    - command: 'dscl . -read /Users/$(whoami) UserShell | grep -qF "$(which fish)" || chsh -s $(which fish) -u $(whoami)'
      description: Making fish the default shell (skipped if already set).
      stdout: true
      stdin: true
      stderr: true
